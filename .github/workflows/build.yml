name: Build exe
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - shell: bash
        run: mkdir -p bin && curl -L -o bin/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: Vibrato-exe, path: dist/*.exe }
